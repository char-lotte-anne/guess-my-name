name: Train Global Model

on:
  schedule:
    # Every Sunday at midnight UTC.
    # NOTE: GitHub disables scheduled workflows after 60 days of repository
    # inactivity and emails the owner. If runs stop appearing, re-enable the
    # workflow from the Actions tab.
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

# The default GITHUB_TOKEN is read-only on modern repos. Creating a release
# needs contents: write. issues: read is enough now that we no longer close
# processed issues.
permissions:
  contents: write
  issues: read

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Cheap (no dependencies) and stops a broken build from publishing a
      # model that clients would then download.
      - name: Run tests
        run: node --test "tests/**/*.test.js"

      # npm ci, not npm install: installs exactly what package-lock.json
      # pins, so a run today and a run in six months train on the same
      # library versions.
      - name: Install dependencies
        run: npm ci

      # Only production dependencies are audited. tfjs-node's findings all come
      # from its native-binary installer, which runs here and never reaches a
      # visitor; `npm audit fix --force` "resolves" them by downgrading
      # tfjs-node from 4.x to 0.1.11, which would be far worse than the
      # exposure. See the note in package.json.
      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Collect training data
        run: node scripts/collect-training-data.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Decrypts issue bodies written by api/create-issue.js.
          # Must match TRAINING_DATA_KEY in the Vercel project.
          TRAINING_DATA_KEY: ${{ secrets.TRAINING_DATA_KEY }}

      - name: Train model
        run: node scripts/train-model.js
        env:
          TRAINING_DATA_FILE: data/training-data.json

      - name: Check if model was created
        id: check-model
        run: |
          if [ -f "model/model.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "A model was produced; a release will be published."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No model was produced (not enough training data yet). Skipping release."
          fi

      - name: Create Release
        if: steps.check-model.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            model/model.json
            model/*.bin
            model/name-index.json
          tag_name: model-v${{ github.run_number }}
          name: Global Model v${{ github.run_number }}
          body: |
            Automated model training run.

            - Run ID: ${{ github.run_id }}
            - Commit: ${{ github.sha }}

            Trained on aggregated user feedback. Clients pick this up on their
            next visit via the releases API.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
